name: Foundation CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  screenshot-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: proposed
      - uses: actions/checkout@v4
        with:
          ref: main
          path: current
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install both app builds and Chromium
        run: |
          cd proposed
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          cd ../current
          npm install --no-audit --no-fund
      - name: Build both app versions
        run: |
          (cd proposed && npm run build)
          (cd current && npm run build)
      - name: Start preview servers
        run: |
          (cd proposed && npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/proposed-vite.log 2>&1 &)
          (cd current && npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/current-vite.log 2>&1 &)
      - name: Capture actual browser-rendered office screenshots
        run: node proposed/scripts/capture-office-comparison.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: virtual-office-before-after-pr34
          path: comparison/*.png
          retention-days: 14
