name: GitHub Pages (CI-gated)
on:
  workflow_run:
    workflows: ["Foundation CI"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ai-virtual-office-pages
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Reverify exact commit
        run: npm test && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke-test published GitHub Pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5 --retry-all-errors "$PAGE_URL" -o /tmp/office-index.html
          grep -q 'สำนักงานเสมือน AI' /tmp/office-index.html
          ASSET_PATH=$(grep -oE '/ai-virtual-office/assets/[^"]+\.js' /tmp/office-index.html | head -n 1)
          test -n "$ASSET_PATH"
          ASSET_URL="https://lnwlawyer.github.io${ASSET_PATH}"
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5 --retry-all-errors "$ASSET_URL" -o /tmp/office-app.js
          test -s /tmp/office-app.js
          echo "GitHub Pages HTML and JavaScript asset are reachable."
