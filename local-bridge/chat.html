<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Messenger · Local Ollama</title><style>body{font:16px system-ui,'Noto Sans Thai',sans-serif;margin:0;background:#eef3f7;color:#1a3346}.wrap{max-width:850px;margin:30px auto;background:white;border:1px solid #d8e1e9;border-radius:14px;display:flex;flex-direction:column;height:min(90vh,850px)}header{padding:16px 22px;border-bottom:1px solid #ddd}h1{font-size:21px;margin:0}small{color:#637788}#log{flex:1;overflow:auto;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble{padding:12px 15px;border-radius:12px;margin:10px 0;max-width:90%}.user{background:#e0f1fc;margin-left:auto}.agent{background:#f0f3f5}form{display:flex;gap:10px;padding:15px;border-top:1px solid #ddd}textarea{flex:1;resize:vertical;min-height:56px;font:inherit;padding:10px;border:1px solid #bdcbd5;border-radius:9px}button{padding:10px 20px;background:#145c70;color:white;border:0;border-radius:9px;font:inherit}button:disabled{opacity:.5}#state{padding:0 20px 8px;color:#536e7a}@media(max-width:600px){.wrap{margin:0;height:100dvh;border-radius:0}}</style></head><body><div class="wrap"><header><h1>AI Messenger · Ollama ในเครื่อง</h1><small>เชื่อมต่อเฉพาะ 127.0.0.1 · ตอบด้วยโมเดลในเครื่อง · ไม่ใช้ API เสียเงิน · ไม่สั่งงาน Terminal</small></header><div id="log" role="log" aria-live="polite"></div><div id="state" role="status">พร้อมรับข้อความ</div><form id="chat"><textarea id="prompt" maxlength="8000" required placeholder="พิมพ์ข้อความภาษาไทย..."></textarea><button id="send">ส่ง</button></form></div><script>const log=document.querySelector('#log'),form=document.querySelector('#chat'),prompt=document.querySelector('#prompt'),button=document.querySelector('#send'),state=document.querySelector('#state');function add(who,text){const p=document.createElement('div');p.className='bubble '+who;p.textContent=text;log.append(p);log.scrollTop=log.scrollHeight}form.addEventListener('submit',async e=>{e.preventDefault();const value=prompt.value.trim();if(!value)return;add('user',value);prompt.value='';button.disabled=true;state.textContent='Ollama กำลังประมวลผล...';try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:value})});const data=await res.json();if(!res.ok)throw new Error(data.error||'ไม่สามารถประมวลผลได้');add('agent',data.content);state.textContent='พร้อมรับข้อความ'}catch(err){state.textContent='เกิดข้อผิดพลาด';add('agent',err.message)}finally{button.disabled=false;prompt.focus()}});</script></body></html>
