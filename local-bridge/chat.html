<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Virtual Office · Local Messenger</title><style>body{font:15px system-ui,sans-serif;background:#e9eff6;margin:0;color:#23374c}.app{max-width:1120px;margin:22px auto;height:min(92vh,900px);display:grid;grid-template-columns:240px 1fr;background:white;border:1px solid #bdccdc;border-radius:13px;overflow:hidden;box-shadow:0 8px 28px #334c6820}aside{background:#e8f2fa;border-right:1px solid #c9d9e8;padding:14px;overflow:auto}h1{font-size:18px;margin:0 0 5px}.muted{color:#63798b;font-size:12px}.agent{width:100%;border:0;background:transparent;text-align:left;padding:12px 10px;border-radius:9px;color:#264257;cursor:pointer;font:inherit}.agent.active{background:#c7e3f8;font-weight:700}.agent:hover{background:#d5eaf9}.dot{color:#6d8b9b;margin-right:7px}.chat{display:flex;flex-direction:column;min-height:0}header{background:linear-gradient(90deg,#d6eafb,#f2f8ff);padding:15px 20px;border-bottom:1px solid #c8d8e6}header strong{font-size:18px}#log{flex:1;overflow:auto;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble{max-width:84%;margin:10px 0;padding:11px 15px;border-radius:13px;line-height:1.6}.user{background:#dceefa;margin-left:auto}.assistant{background:#f0f3f6}#state{padding:5px 18px;color:#56718a;font-size:12px}form{display:flex;gap:10px;padding:13px;border-top:1px solid #d9e2ec}textarea{flex:1;resize:vertical;min-height:60px;max-height:150px;font:inherit;padding:10px;border:1px solid #bccad8;border-radius:8px}button.send{background:#17648a;color:white;border:0;border-radius:9px;padding:0 23px;font:inherit}button:disabled{opacity:.5}#clear{font-size:12px;background:transparent;border:1px solid #bdcad8;border-radius:7px;padding:6px;cursor:pointer}@media(max-width:680px){.app{margin:0;height:100dvh;border-radius:0;grid-template-columns:115px 1fr}aside{padding:7px}.agent{font-size:12px;padding:9px 4px}header{padding:12px}#log{padding:10px}.bubble{max-width:92%}}</style></head><body><div class="app"><aside><h1>AI Virtual Office</h1><p class="muted">Local Messenger · Ollama</p><p class="muted">ประวัติบันทึกเฉพาะเบราว์เซอร์นี้</p><nav id="agents" aria-label="เลือกพนักงาน AI"></nav><p class="muted">○ พนักงานจำลองบทบาท · โมเดลในเครื่อง</p></aside><main class="chat"><header><strong id="title">ฝ่ายพัฒนา</strong><div class="muted">MSN-style · 127.0.0.1 · สนทนาเท่านั้น ไม่สั่งงานเครื่อง</div><button id="clear" type="button">ล้างแชทของพนักงานนี้</button></header><div id="log" role="log" aria-live="polite"></div><div id="state" role="status">พร้อมรับข้อความ</div><form id="form"><textarea id="prompt" maxlength="4000" required placeholder="พิมพ์ข้อความ..."></textarea><button class="send" id="send">ส่ง</button></form></main></div><script>const roles={manager:'ผู้จัดการสำนักงาน',legal:'ฝ่ายกฎหมาย',writer:'ฝ่ายเอกสาร',designer:'ฝ่ายออกแบบ',analyst:'ฝ่ายวิเคราะห์',developer:'ฝ่ายพัฒนา',reviewer:'ฝ่ายตรวจสอบ'};const storageKey='ai-virtual-office-local-chats-v1';const chats=Object.fromEntries(Object.keys(roles).map(k=>[k,[]]));try{const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');for(const id of Object.keys(roles)){if(Array.isArray(saved[id]))chats[id]=saved[id].filter(m=>m&&['user','assistant'].includes(m.role)&&typeof m.content==='string').slice(-100).map(m=>({role:m.role,content:m.content.slice(0,20000)}))}}catch{}function persist(){try{localStorage.setItem(storageKey,JSON.stringify(chats))}catch{state.textContent='ไม่สามารถบันทึกประวัติในเบราว์เซอร์ได้'}}let role='developer',busy=false;const nav=document.querySelector('#agents'),log=document.querySelector('#log'),form=document.querySelector('#form'),input=document.querySelector('#prompt'),send=document.querySelector('#send'),state=document.querySelector('#state');function bubble(kind,text){const el=document.createElement('div');el.className='bubble '+kind;el.textContent=text;log.append(el)}function render(){nav.replaceChildren();for(const [id,label] of Object.entries(roles)){const b=document.createElement('button');b.type='button';b.className='agent'+(id===role?' active':'');b.textContent='○ '+label;b.disabled=busy;b.onclick=()=>{role=id;render()};nav.append(b)}document.querySelector('#title').textContent=roles[role];log.replaceChildren();for(const msg of chats[role])bubble(msg.role,msg.content);log.scrollTop=log.scrollHeight}form.onsubmit=async e=>{e.preventDefault();if(busy)return;const message=input.value.trim();if(!message)return;const selected=role;const history=chats[selected].slice(-8).map(m=>({role:m.role,content:m.content.slice(0,1500)}));chats[selected].push({role:'user',content:message});persist();input.value='';busy=true;send.disabled=true;state.textContent='กำลังประมวลผล...';render();try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:selected,prompt:message,history})});const data=await res.json();if(!res.ok)throw Error(data.error||'ไม่สามารถตอบได้');chats[selected].push({role:'assistant',content:data.content});persist()}catch(err){chats[selected].push({role:'assistant',content:'เกิดข้อผิดพลาด: '+err.message});persist()}finally{busy=false;send.disabled=false;state.textContent='พร้อมรับข้อความ';render();input.focus()}};document.querySelector('#clear').onclick=()=>{if(busy)return;chats[role]=[];persist();render()};render();</script></body></html>
